# One-click durable hosting on Render (no laptop tunnel).
# Dashboard: https://dashboard.render.com → New → Blueprint → this repo
services:
  - type: web
    name: blanco
    runtime: docker
    plan: free
    healthCheckPath: /uk
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        fromService:
          type: web
          name: blanco
          property: host
      - key: DATABASE_URL
        value: file:./prisma/dev.db
